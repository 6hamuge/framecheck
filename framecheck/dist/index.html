<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9f9f9">
  <title>FrameCheck · 압축 전후 프레임 비교</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="shell wordmark"><span class="wordmark-icon" aria-hidden="true"></span>FrameCheck</div>
  </header>
  <main class="shell">
    <section class="workspace" aria-labelledby="page-title">
      <div class="intro">
        <h1 id="page-title">압축 전후 프레임 비교</h1>
        <p class="lead">해상도와 JPEG 품질을 바꿔 영상의 디테일을 확인하세요.</p>
        <div class="actions">
          <button id="open-video" class="button-primary" type="button">내 영상 열기</button>
          <button id="open-sample" class="button-secondary" type="button">샘플로 시작</button>
          <input id="video-file" type="file" accept=".mp4,.webm,video/mp4,video/webm" hidden>
        </div>
        <div class="file-help">
          <p>MP4 · WebM / 최대 30초 · 50MB</p>
          <p>내 영상은 이 브라우저에서 처리됩니다.</p>
        </div>
        <p id="video-status" class="message" role="status"></p>
        <p id="video-error" class="message error" role="alert"></p>
      </div>
      <div class="frame-card">
        <div class="card-header"><h2>원본 프레임</h2></div>
        <div class="media">
          <img id="sample-poster" src="sample-poster.jpg" alt="실습 샘플 영상의 첫 프레임">
        </div>
      </div>
    </section>
    <section id="comparison" class="comparison" aria-label="프레임 비교" hidden>
      <div class="frame-card timeline">
        <div class="card-header">
          <strong id="file-name"></strong>
          <span id="video-time" class="caption"></span>
        </div>
        <label for="frame-time">시점 선택</label>
        <input id="frame-time" type="range" min="0" step="any" value="0">
        <p id="seek-status" class="message" role="status"></p>
        <button id="retry-seek" class="button-secondary" type="button" hidden>시점 다시 불러오기</button>
      </div>
      <div class="comparison-grid">
        <section class="frame-card" aria-labelledby="original-title">
          <div class="card-header"><h2 id="original-title">원본</h2><span id="frame-size" class="caption"></span></div>
          <div id="original-media" class="media frame-media">
            <canvas id="original-frame" role="img" aria-label="원본 프레임"></canvas>
            <div id="original-outline" class="region-outline" aria-hidden="true" hidden></div>
          </div>
          <div id="original-detail" class="region-detail" hidden>
            <div class="card-header"><span>선택 영역 확대</span><span id="original-region-size" class="caption"></span></div>
            <div class="media"><canvas id="original-crop" role="img" aria-label="원본 선택 영역 확대"></canvas></div>
          </div>
        </section>
        <section class="frame-card" aria-labelledby="preview-title">
          <div class="card-header"><h2 id="preview-title">변환 미리보기</h2><span id="preview-size" class="caption"></span></div>
          <div id="preview-media" class="media frame-media">
            <canvas id="preview-frame" role="img" aria-label="JPEG 변환 프레임"></canvas>
            <div id="preview-outline" class="region-outline" aria-hidden="true" hidden></div>
          </div>
          <div id="preview-detail" class="region-detail" hidden>
            <div class="card-header"><span>선택 영역 확대</span><span id="preview-region-size" class="caption"></span></div>
            <div class="media"><canvas id="preview-crop" role="img" aria-label="JPEG 변환 선택 영역 확대"></canvas></div>
          </div>
        </section>
      </div>
      <form id="region-form" class="frame-card" novalidate>
        <h2>비교 영역</h2>
        <p class="caption">원본 프레임에서 드래그하거나 픽셀 좌표를 입력하세요.</p>
        <fieldset id="region-controls">
          <legend class="visually-hidden">영역 좌표 및 크기</legend>
          <div class="region-fields">
            <label>가로 위치 (x)<input name="x" type="number" min="0" step="1" required></label>
            <label>세로 위치 (y)<input name="y" type="number" min="0" step="1" required></label>
            <label>너비<input name="width" type="number" min="1" step="1" required></label>
            <label>높이<input name="height" type="number" min="1" step="1" required></label>
          </div>
          <button class="button-secondary" type="submit">영역 적용</button>
        </fieldset>
        <p id="region-error" class="message error" role="alert"></p>
      </form>
      <section class="frame-card compression" aria-labelledby="compression-title">
        <h2 id="compression-title">프레임 압축 미리보기</h2>
        <fieldset id="compression-controls">
          <legend class="visually-hidden">압축 설정</legend>
          <div class="compression-grid">
            <label for="resolution">해상도
              <select id="resolution">
                <option value="100">100%</option>
                <option value="75">75%</option>
                <option value="50">50%</option>
                <option value="25">25%</option>
              </select>
            </label>
            <div>
              <div class="card-header">
                <label for="jpeg-quality">JPEG 품질</label>
                <output id="quality-value" for="jpeg-quality" aria-live="off">75</output>
              </div>
              <input id="jpeg-quality" type="range" min="0" max="100" step="1" value="75">
            </div>
          </div>
        </fieldset>
        <p id="preview-status" class="message" role="status"></p>
        <p id="preview-error" class="message error" role="alert"></p>
        <div class="actions export-actions">
          <button id="retry-preview" class="button-secondary" type="button" hidden>미리보기 다시 만들기</button>
          <button id="save-png" class="button-primary" type="button" disabled aria-describedby="save-note">비교 PNG 저장</button>
        </div>
        <p id="save-note" class="caption"></p>
        <p id="save-status" class="message" role="status"></p>
        <p id="save-error" class="message error" role="alert"></p>
      </section>
    </section>
  </main>
</body>
</html>
